# go-ax25 configuration file
# All values shown are the built-in defaults.
# Remove the leading # to override a value.

# -- Station identity --
[station]
callsign = N0CALL
ssid = 0

# -- Beacon --
[beacon]
# source = N0CALL           # source callsign (required to enable beacon)
destination = BEACON
# via =                     # comma-separated digipeater path, e.g. WIDE1-1,WIDE2-1
text = GO AX.25 Beacon
every = 0                   # minutes between beacons (0 = disabled)

# -- Digipeater --
[digi]
# callsign = N0CALL         # digipeater callsign (required to enable digi)

# -- AX.25 connected-mode timers --
[conn]
t1_ms = 10000               # T1 acknowledgement timeout (ms)
t2_ms = 1000                # T2 response delay timeout (ms)
t3_ms = 180000              # T3 inactive link timeout (ms)
n2_retries = 10             # N2 maximum retry count
window_size = 4             # k: maximum outstanding I-frames (1-7)

# -- Router --
[router]
mode = switch               # dispatch mode: switch, bridge, or hub
port_queue_depth = 32       # default per-port frame queue depth

# -- AGWPE client --
[agwpe.client]
read_buf = 4132             # rx read buffer size (bytes)
tx_queue_depth = 8          # TX channel depth

# -- AGWPE server --
[agwpe.server]
port = 8000                 # AGWPE TCP listen port
read_buf = 4132             # rx read buffer size (bytes)
tx_queue_depth = 64         # TX channel depth
max_conns = 4               # max simultaneous AX.25 connections

# -- KISS serial PHY --
[kiss.serial]
enabled = false
device = /dev/ttyUSB0
baud = 9600
read_buf = 1024             # rx read buffer size (bytes)
rx_queue_depth = 64         # rx frame queue depth
tx_queue_depth = 32         # tx frame queue depth

# -- KISS TCP client PHY --
[kiss.client]
enabled = false
read_buf = 4096             # rx read buffer size (bytes)
tx_queue_depth = 8          # TX channel depth

# -- KISS TCP server PHY --
[kiss.server]
port = 8001                # KISS TCP listen port
read_buf = 4096             # rx read buffer size per client (bytes)
tx_queue_depth = 8          # TX channel depth per client

# -- BBS --
[bbs]
callsign = N0CALL-2         # BBS station callsign
host = localhost             # AGWPE server host
port = 8000                 # AGWPE server port
greeting = Welcome to Go AX.25 BBS
prompt = BBS>
sysop_name = SYSOP
version = go-ax25-bbs 0.1
max_messages = 500
max_body_len = 102400
db_path = bbs.db
# sysop_secret =            # SYSOP challenge-response secret (min 16 chars)
# sysop_challenge_timeout_s = 300
# sysop_session_timeout_s = 600
# sysop_lockout_s = 900
# sysop_max_attempts = 3
